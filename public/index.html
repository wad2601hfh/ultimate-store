<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Restaurant | Personal Assistant</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <div class="app-container">
        <section class="chat-section">
            <header>
                <h1>Smart Restaurant.</h1>
                <span class="subtitle">Personal Food Assistance</span>
            </header>
            
            <div class="chat-window" id="chat-window">
                <div class="message bot">
                    <p>Good day. I am your personal dining assistant.<br>What are you craving? (e.g. "Spicy Duck", "Budget Lunch", "Coffee")</p>
                </div>
            </div>

            <div class="input-area">
                <div class="chips">
                    <button onclick="sendQuick('Best Beef & Rendang')">Beef/Rendang</button>
                    <button onclick="sendQuick('Something cheap')">Budget &lt; 20k</button>
                    <button onclick="sendQuick('Comfort Soup')">Soto/Soup</button>
                    <button onclick="sendQuick('Sweet Dessert')">Dessert</button>
                    <button onclick="sendQuick('Coffee time')">Coffee</button>
                </div>
                <div class="input-wrapper">
                    <input type="text" id="user-input" placeholder="Type your request...">
                    <button id="send-btn">→</button>
                </div>
            </div>
        </section>

        <section class="display-section">
            <div class="market-label">TOP 3 RECOMMENDATIONS</div>
            <div id="cards-container" class="cards-grid">
                <div class="empty-state">System Ready. Awaiting request.</div>
            </div>
        </section>
    </div>

    <div id="toast" class="toast hidden">Order Confirmed</div>
    <script src="app.js"></script>
</body>
</html>
